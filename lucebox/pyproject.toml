[project]
name = "lucebox"
version = "0.2.0"
description = "Host-side CLI for the lucebox-hub container: orchestration, autotune, benchmark sweep"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lucebox" }]
license = { text = "Apache-2.0" }

# Kept intentionally narrow. typer pulls click+rich; tomli-w gives us TOML
# writes (stdlib tomllib only reads). httpx for the smoke + readiness probes.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
lucebox = "lucebox.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# RUF: ruff-native lints. Keep this list tight — we lint the same way the
# rest of the workspace does.
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Typer's decorator types are dynamic; we tolerate the noise rather than
# rewriting Typer's own type stubs.
disallow_untyped_decorators = false
